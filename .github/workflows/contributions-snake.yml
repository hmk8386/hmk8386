
name: Generate Snake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hmk8386
          outputs: dist/contributions-snake.svg

      - name: Publish Snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Snake (?)"
          git config user.email "338995609+hmk8386@users.noreply.github.com"

          git add dist/contributions-snake.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update contribution snake"

          git push origin HEAD:output
