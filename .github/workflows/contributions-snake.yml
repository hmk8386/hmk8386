
name: Generate Snake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hmk8386
          outputs: dist/contributions-snake.svg

      - name: Publish Snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "snake"
          git config user.email "338995609+hmk8386@users.noreply.github.com"

          git fetch origin output

          mkdir -p /tmp/snake
          cp dist/contributions-snake.svg /tmp/snake/contributions-snake.svg

          git switch output
          cp /tmp/snake/contributions-snake.svg contributions-snake.svg

          git add contributions-snake.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update contribution snake"

          git push origin output
